<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" fill="none" class="developer-illustration">
  <defs>
    <!-- Background Ambient Glow -->
    <radialGradient id="heroGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#3B82F6" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0" />
    </radialGradient>

    <!-- Screen Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>

    <!-- Subtle Card Shadow -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3B82F6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="340" cy="270" r="260" fill="url(#heroGlow)" />

  <!-- Grid Pattern Backdrop Grid -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="0.75" stroke-dasharray="3 3">
    <line x1="80" y1="120" x2="600" y2="120" />
    <line x1="80" y1="180" x2="600" y2="180" />
    <line x1="80" y1="240" x2="600" y2="240" />
    <line x1="80" y1="300" x2="600" y2="300" />
    <line x1="80" y1="360" x2="600" y2="360" />
    <line x1="80" y1="420" x2="600" y2="420" />
    <line x1="140" y1="80" x2="140" y2="460" />
    <line x1="220" y1="80" x2="220" y2="460" />
    <line x1="300" y1="80" x2="300" y2="460" />
    <line x1="380" y1="80" x2="380" y2="460" />
    <line x1="460" y1="80" x2="460" y2="460" />
    <line x1="540" y1="80" x2="540" y2="460" />
  </g>

  <!-- Workstation Desk Surface -->
  <g id="deskGroup">
    <!-- Desk Top -->
    <path d="M 60 410 L 620 410 L 590 426 L 90 426 Z" fill="#141418" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Desk Bevel -->
    <line x1="60" y1="410" x2="620" y2="410" stroke="rgba(255,255,255,0.14)" stroke-width="1.5" />
    <!-- Desk Legs subtle shadow -->
    <line x1="120" y1="426" x2="120" y2="490" stroke="#1A1A1E" stroke-width="8" stroke-linecap="round" />
    <line x1="560" y1="426" x2="560" y2="490" stroke="#1A1A1E" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Dual Monitor Workspace Background Stand -->
  <rect x="330" y="320" width="20" height="90" rx="3" fill="#18181D" stroke="rgba(255,255,255,0.06)" />
  <ellipse cx="340" cy="410" rx="45" ry="7" fill="#1A1A22" stroke="rgba(255,255,255,0.08)" />

  <!-- Main Primary Display Screen -->
  <g id="mainMonitor" filter="url(#softShadow)">
    <!-- Outer Frame -->
    <rect x="180" y="110" width="320" height="210" rx="10" fill="#0C0D10" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
    <!-- Screen Inner Display -->
    <rect x="190" y="120" width="300" height="185" rx="6" fill="#0B0E14" />
    <rect x="190" y="120" width="300" height="185" rx="6" fill="url(#screenGlow)" opacity="0.3" />

    <!-- Window Header / Tabs -->
    <path d="M 190 126 C 190 122.7 192.7 120 196 120 L 484 120 C 487.3 120 490 122.7 490 126 L 490 142 L 190 142 Z" fill="#131722" />
    <!-- Window Control Dots -->
    <circle cx="204" cy="131" r="3.5" fill="#EF4444" opacity="0.75" />
    <circle cx="215" cy="131" r="3.5" fill="#F59E0B" opacity="0.75" />
    <circle cx="226" cy="131" r="3.5" fill="#10B981" opacity="0.75" />
    <!-- Editor Tab -->
    <rect x="242" y="124" width="76" height="18" rx="4" fill="#0B0E14" stroke="rgba(59,130,246,0.3)" stroke-width="0.8" />
    <text x="250" y="136" font-family="'JetBrains Mono', monospace" font-size="8" fill="#93C5FD">App.tsx</text>
    <rect x="322" y="124" width="60" height="18" rx="4" fill="#131722" />
    <text x="330" y="136" font-family="'JetBrains Mono', monospace" font-size="8" fill="#64748B">api.ts</text>

    <!-- Code Editor Body -->
    <!-- Line Numbers -->
    <text x="202" y="162" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">01</text>
    <text x="202" y="177" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">02</text>
    <text x="202" y="192" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">03</text>
    <text x="202" y="207" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">04</text>
    <text x="202" y="222" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">05</text>
    <text x="202" y="237" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">06</text>
    <text x="202" y="252" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">07</text>
    <text x="202" y="267" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">08</text>
    <text x="202" y="282" font-family="'JetBrains Mono', monospace" font-size="8" fill="#334155">09</text>

    <!-- Code Syntax Lines -->
    <!-- import React from 'react' -->
    <rect x="222" y="156" width="34" height="6" rx="2" fill="#F43F5E" opacity="0.8" />
    <rect x="260" y="156" width="46" height="6" rx="2" fill="#38BDF8" opacity="0.85" />
    <rect x="310" y="156" width="22" height="6" rx="2" fill="#F43F5E" opacity="0.8" />
    <rect x="336" y="156" width="38" height="6" rx="2" fill="#34D399" opacity="0.85" />

    <!-- const engineer = { -->
    <rect x="222" y="171" width="30" height="6" rx="2" fill="#A855F7" opacity="0.85" />
    <rect x="256" y="171" width="52" height="6" rx="2" fill="#60A5FA" opacity="0.9" />
    <rect x="312" y="171" width="8" height="6" rx="2" fill="#E2E8F0" opacity="0.7" />

    <!-- name: 'Sachin Thakur', -->
    <rect x="234" y="186" width="32" height="6" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="270" y="186" width="70" height="6" rx="2" fill="#34D399" opacity="0.85" />

    <!-- stack: ['MERN', 'AI/RAG'], -->
    <rect x="234" y="201" width="36" height="6" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="274" y="201" width="36" height="6" rx="2" fill="#FBBF24" opacity="0.8" />
    <rect x="314" y="201" width="48" height="6" rx="2" fill="#FBBF24" opacity="0.8" />

    <!-- experience: '2.4+ years', -->
    <rect x="234" y="216" width="60" height="6" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="298" y="216" width="56" height="6" rx="2" fill="#34D399" opacity="0.85" />

    <!-- status: 'Building...' -->
    <rect x="234" y="231" width="40" height="6" rx="2" fill="#38BDF8" opacity="0.8" />
    <rect x="278" y="231" width="50" height="6" rx="2" fill="#3B82F6" opacity="0.9" />

    <!-- }; -->
    <rect x="222" y="246" width="12" height="6" rx="2" fill="#E2E8F0" opacity="0.7" />

    <!-- Mini Terminal at Bottom of Screen -->
    <rect x="222" y="260" width="254" height="34" rx="4" fill="#07090E" stroke="rgba(255,255,255,0.06)" />
    <circle cx="230" cy="268" r="2" fill="#10B981" />
    <text x="236" y="271" font-family="'JetBrains Mono', monospace" font-size="7" fill="#6EE7B7">ready - compiled successfully in 180ms</text>
    <text x="230" y="284" font-family="'JetBrains Mono', monospace" font-size="7" fill="#3B82F6">➜ test pass: 100% | full-stack ready</text>
  </g>

  <!-- Laptop at Left Side of Desk -->
  <g id="laptop">
    <!-- Screen -->
    <path d="M 100 290 L 175 270 L 175 350 L 100 365 Z" fill="#111319" stroke="rgba(255,255,255,0.12)" />
    <path d="M 104 294 L 171 276 L 171 346 L 104 361 Z" fill="#0B1325" />
    <!-- Laptop screen glow lines -->
    <line x1="110" y1="305" x2="160" y2="292" stroke="#3B82F6" stroke-width="2" stroke-linecap="round" opacity="0.8" />
    <line x1="110" y1="316" x2="150" y2="306" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <line x1="110" y1="327" x2="165" y2="313" stroke="#34D399" stroke-width="2" stroke-linecap="round" opacity="0.7" />
    <line x1="110" y1="338" x2="140" y2="330" stroke="#A855F7" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    <!-- Base -->
    <path d="M 88 368 L 180 350 L 195 372 L 95 390 Z" fill="#1A1C24" stroke="rgba(255,255,255,0.08)" />
  </g>

  <!-- Desk Peripherals: Mechanical Keyboard & Mouse -->
  <g id="peripherals">
    <!-- Desk Mat / Mousepad -->
    <rect x="210" y="375" width="280" height="30" rx="4" fill="#0C0D11" stroke="rgba(255,255,255,0.04)" />
    <!-- Keyboard -->
    <rect x="230" y="380" width="150" height="20" rx="3" fill="#161820" stroke="rgba(255,255,255,0.1)" />
    <!-- Key Caps Matrix Representation -->
    <line x1="236" y1="385" x2="374" y2="385" stroke="#262A36" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="236" y1="390" x2="374" y2="390" stroke="#262A36" stroke-width="2" stroke-dasharray="4 2" />
    <line x1="236" y1="395" x2="374" y2="395" stroke="#262A36" stroke-width="2" stroke-dasharray="4 2" />
    <!-- Spacebar Highlight Accent -->
    <rect x="280" y="394" width="40" height="3" rx="1.5" fill="#3B82F6" opacity="0.9" />

    <!-- Ergonomic Mouse -->
    <rect x="420" y="382" width="18" height="24" rx="9" fill="#181A22" stroke="rgba(255,255,255,0.12)" />
    <line x1="429" y1="384" x2="429" y2="392" stroke="#3B82F6" stroke-width="1.5" />
  </g>

  <!-- Developer Silhouette / Working Figure -->
  <g id="developerFigure">
    <!-- Chair Backrest behind developer -->
    <path d="M 330 330 Q 340 310 350 330 L 356 430 L 324 430 Z" fill="#0D0E12" opacity="0.7" />

    <!-- Developer Torso / Hoodie (Modern clean silhouette in deep tones) -->
    <path d="M 300 440 C 300 405 320 380 340 380 C 360 380 380 405 380 440 Z" fill="#181A22" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <!-- Collar & Hoodie Accent Line -->
    <path d="M 332 382 L 340 398 L 348 382" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85" />

    <!-- Head / Hair Silhouette -->
    <ellipse cx="340" cy="355" rx="16" ry="19" fill="#20232E" />
    <!-- Developer Headphone Arc -->
    <path d="M 322 355 C 322 340 358 340 358 355" stroke="#3B82F6" stroke-width="3" fill="none" stroke-linecap="round" />
    <rect x="320" y="350" width="5" height="12" rx="2.5" fill="#60A5FA" />
    <rect x="355" y="350" width="5" height="12" rx="2.5" fill="#60A5FA" />

    <!-- Forearms resting on desk / typing -->
    <path d="M 306 420 Q 320 400 336 395" stroke="#1F232F" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 374 420 Q 360 400 346 395" stroke="#1F232F" stroke-width="8" stroke-linecap="round" fill="none" />
  </g>

  <!-- Floating Tech Badges & Interactive Architecture Cards (Linear/Vercel Aesthetic) -->

  <!-- Card 1: Top Right - AI & RAG Engine Card -->
  <g id="floatingCardAI" filter="url(#badgeGlow)">
    <rect x="490" y="80" width="145" height="65" rx="10" fill="#10121A" stroke="rgba(59,130,246,0.4)" stroke-width="1.2" />
    <circle cx="512" cy="100" r="10" fill="rgba(59,130,246,0.15)" />
    <!-- Brain / Spark Icon -->
    <path d="M 508 100 L 516 100 M 512 96 L 512 104" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" />
    <text x="528" y="99" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FAFAFA">AI Architecture</text>
    <text x="528" y="112" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3B82F6">RAG · LLM Pipeline</text>
    <rect x="504" y="124" width="70" height="13" rx="4" fill="rgba(59,130,246,0.12)" />
    <text x="509" y="133" font-family="'JetBrains Mono', monospace" font-size="7.5" fill="#93C5FD">latency: 42ms</text>
    <!-- Status Dot -->
    <circle cx="618" cy="95" r="3.5" fill="#10B981" />
  </g>

  <!-- Card 2: Top Left - Full-Stack MERN Badge -->
  <g id="floatingCardStack" filter="url(#badgeGlow)">
    <rect x="45" y="140" width="135" height="58" rx="10" fill="#10121A" stroke="rgba(255,255,255,0.1)" stroke-width="1.2" />
    <!-- React Logo Node Shape -->
    <ellipse cx="65" cy="165" rx="10" ry="4" stroke="#38BDF8" stroke-width="1.5" fill="none" transform="rotate(30 65 165)" />
    <ellipse cx="65" cy="165" rx="10" ry="4" stroke="#38BDF8" stroke-width="1.5" fill="none" transform="rotate(-30 65 165)" />
    <circle cx="65" cy="165" r="2" fill="#38BDF8" />
    <text x="84" y="161" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#FAFAFA">MERN Stack</text>
    <text x="84" y="174" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#A1A1AA">React · Node · Mongo</text>
    <circle cx="165" cy="152" r="3" fill="#3B82F6" />
  </g>

  <!-- Card 3: Bottom Right - System Performance / Deploy Status -->
  <g id="floatingCardMetrics" filter="url(#badgeGlow)">
    <rect x="485" y="270" width="155" height="68" rx="10" fill="#10121A" stroke="rgba(16,185,129,0.3)" stroke-width="1.2" />
    <!-- Activity sparkline -->
    <path d="M 500 312 L 515 312 L 525 298 L 535 316 L 545 292 L 555 310 L 570 310" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <text x="500" y="288" font-family="'Inter', sans-serif" font-weight="600" font-size="10.5" fill="#FAFAFA">System Optimization</text>
    <text x="580" y="304" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="bold" fill="#10B981">+30%</text>
    <text x="500" y="328" font-family="'JetBrains Mono', monospace" font-size="8" fill="#71717A">Render &amp; API throughput</text>
  </g>

  <!-- Connecting Architectural Circuit Lines (Subtle) -->
  <path d="M 490 120 L 450 140" stroke="#3B82F6" stroke-width="1" stroke-dasharray="3 3" opacity="0.4" />
  <path d="M 180 180 L 210 195" stroke="#38BDF8" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />
  <path d="M 485 300 L 460 280" stroke="#10B981" stroke-width="1" stroke-dasharray="3 3" opacity="0.3" />

  <!-- Ambient Light Reflection on Desk -->
  <ellipse cx="340" cy="415" rx="120" ry="6" fill="#3B82F6" opacity="0.15" />
</svg>
